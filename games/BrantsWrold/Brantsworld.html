<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Brantsworld</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #07102a;
      font-family: Arial, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }

    body { position: fixed; inset: 0; }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    #hud {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      color: white;
      pointer-events: none;
      z-index: 5;
    }

    .topbar {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      max-width: calc(100vw - 110px);
    }

    .badge {
      background: #101a38;
      border: 2px solid #ffffff55;
      border-radius: 14px;
      padding: 7px 10px;
      font-weight: bold;
      white-space: nowrap;
    }

    .energyWrap {
      width: 180px;
      height: 16px;
      border: 2px solid white;
      border-radius: 12px;
      background: #18203d;
      overflow: hidden;
    }

    .energy {
      width: 100%;
      height: 100%;
      background: #54dcff;
    }

    .button {
      position: fixed;
      border: 0;
      color: white;
      font-weight: bold;
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .pause {
      right: max(12px, env(safe-area-inset-right));
      top: max(12px, env(safe-area-inset-top));
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #101a38;
      border: 2px solid white;
      font-size: 20px;
    }

    .burst {
      right: max(25px, env(safe-area-inset-right));
      bottom: max(25px, env(safe-area-inset-bottom));
      width: 115px;
      height: 115px;
      border-radius: 50%;
      background: #ff6b7c;
      font-size: 18px;
    }

    .joystick {
      position: fixed;
      left: max(25px, env(safe-area-inset-left));
      bottom: max(25px, env(safe-area-inset-bottom));
      width: 135px;
      height: 135px;
      border-radius: 50%;
      background: #ffffff22;
      border: 3px solid #ffffff66;
      pointer-events: auto;
      touch-action: none;
    }

    .stick {
      position: absolute;
      left: 38px;
      top: 38px;
      width: 59px;
      height: 59px;
      border-radius: 50%;
      background: #73dcff;
      border: 3px solid white;
      pointer-events: none;
    }

    .message {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      background: rgba(2, 5, 18, .82);
      pointer-events: auto;
      z-index: 1000;
      isolation: isolate;
      overflow: auto;
      touch-action: manipulation;
      -webkit-overflow-scrolling: touch;
    }

    .card {
      width: min(520px, calc(100vw - 40px));
      max-height: calc(100dvh - 40px);
      overflow: auto;
      padding: 30px;
      border-radius: 25px;
      background: #0c1432;
      color: white;
      text-align: center;
      border: 2px solid #ffffff44;
      box-shadow: 0 20px 80px #0009;
      position: relative;
      z-index: 1001;
    }

    .card h1 {
      margin: 0 0 12px;
      font-size: 42px;
    }

    .card p {
      font-size: 18px;
      line-height: 1.45;
    }

    .play {
      border: 0;
      border-radius: 16px;
      padding: 14px 25px;
      font-size: 18px;
      font-weight: bold;
      background: #55e6ff;
      color: #071020;
      min-height: 52px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 700px) {
      .topbar {
        top: max(8px, env(safe-area-inset-top));
        transform: translateX(-50%) scale(.68);
        transform-origin: top center;
        max-width: none;
      }

      .joystick {
        width: 120px;
        height: 120px;
      }

      .stick {
        left: 33px;
        top: 33px;
        width: 54px;
        height: 54px;
      }

      .burst {
        width: 100px;
        height: 100px;
        font-size: 15px;
      }

      .message {
        padding: 16px;
      }

      .card {
        width: min(92vw, 520px);
        padding: 24px 20px;
        border-radius: 20px;
      }

      .card h1 {
        font-size: clamp(30px, 9vw, 42px);
      }

      .card p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="topbar">
      <div class="badge">Stars <span id="stars">0</span></div>
      <div class="badge">Robots <span id="robots">0/8</span></div>
      <div class="badge">Energy <span id="energyText">100</span></div>
      <div class="energyWrap">
        <div id="energy" class="energy"></div>
      </div>
    </div>

    <button id="pause" class="button pause" type="button">II</button>

    <div id="joystick" class="joystick">
      <div id="stick" class="stick"></div>
    </div>

    <button id="burst" class="button burst" type="button">STAR<br>BURST</button>
  </div>

  <div id="message" class="message">
    <div class="card">
      <h1 id="messageTitle"></h1>
      <p id="messageText"></p>
      <button id="playAgain" class="play" type="button">PLAY AGAIN</button>
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="game.js"></script>
  <script src="controls.js"></script>
</body>
</html>
