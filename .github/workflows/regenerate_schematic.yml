name: Regenerate NexiCode Schematic

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install pytest
          
      - name: Generate Schematic
        run: python schematic_gen.py
        
      - name: Run Precision Verification
        run: pytest tests/test_schematic_engine.py
        
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md schematic.svg
          git commit -m "chore: regenerate system schematic [live]" || exit 0
          git push
